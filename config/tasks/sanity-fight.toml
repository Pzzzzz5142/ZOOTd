# Dynamic material-stage execution. The launcher writes the solver-selected
# stage into an isolated per-run copy; every other sanity-spending parameter is
# fixed here so the current MaaCore receives the non-deprecated expiry policy.
client_type = "Official"
startup = false
closedown = false

[[tasks]]
name = "Spend sanity and all medicine expiring within two days"
type = "Fight"

[tasks.params]
medicine = 0
medicine_expire_days = 2
stone = 0
# Every transaction is real farming, not a paid proxy probe. The host repeats
# successes and inspects each failure before permitting another transaction.
series = 1
times = 1
# Replaced with the validated planner stage only in an isolated per-run copy.
stage = "1-7"
