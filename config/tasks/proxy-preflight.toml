# Navigate and check the client's saved proxy in one MaaCore process.
# Zero battles and zero medicine: only actual farming may spend sanity.
client_type = "Official"
startup = false
closedown = false

[[tasks]]
name = "Open terminal without starting a battle"
type = "Custom"

[tasks.params]
task_names = ["MaaHostProxyTerminal"]

[[tasks]]
name = "Navigate to the requested stage"
type = "Custom"

[tasks.params]
# Replaced with the validated planner stage only in an isolated per-run copy.
# The committed task keeps the launcher's final, universally available fallback.
task_names = ["1-7"]

[[tasks]]
name = "Read-only saved-proxy check"
type = "Custom"

[tasks.params]
task_names = ["StageQueue@CheckPrts"]
